# Argo CD Application that deploys apps/nginx from this repository.
# Same settings as creating the app in the Argo CD UI (manual sync).
# Apply with: kubectl apply -n argocd -f apps/nginx-application.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/jkirthi90/Skillfyme_Final_Projects.git
    targetRevision: HEAD
    path: 08-argocd/apps/nginx
  destination:
    server: https://kubernetes.default.svc
    namespace: default
