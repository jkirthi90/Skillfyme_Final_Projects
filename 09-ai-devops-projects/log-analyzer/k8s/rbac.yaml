apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-log-analyzer
  namespace: default

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-log-analyzer
  namespace: default
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-log-analyzer
  namespace: default
subjects:
  - kind: ServiceAccount
    name: ai-log-analyzer
    namespace: default
roleRef:
  kind: Role
  name: ai-log-analyzer
  apiGroup: rbac.authorization.k8s.io
