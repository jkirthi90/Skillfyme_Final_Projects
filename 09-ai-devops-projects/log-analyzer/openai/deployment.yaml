# OpenAI version of the log analyzer. Create the key as a Secret first:
#   kubectl create secret generic openai-secret --from-literal=api-key=<your-key>
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-log-analyzer
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-log-analyzer
  template:
    metadata:
      labels:
        app: ai-log-analyzer
    spec:
      serviceAccountName: ai-log-analyzer
      containers:
        - name: ai-log-analyzer
          image: ai-log-analyzer:6.1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: api-key
            - name: OPENAI_MODEL
              value: "gpt-5.6-luna"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-log-analyzer
  namespace: default
spec:
  selector:
    app: ai-log-analyzer
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
