apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-test-bad
  namespace: default
spec:
  replicas: 1
  selector: {matchLabels: {app: security-test-bad}}
  template:
    metadata: {labels: {app: security-test-bad}}
    spec:
      hostNetwork: true
      containers:
      - name: bad-container
        image: busybox:latest
        command: ["sh", "-c", "sleep 3600"]
        securityContext:
          privileged: true
          allowPrivilegeEscalation: true
          runAsUser: 0
        volumeMounts: [{name: host, mountPath: /host}]
      volumes:
      - name: host
        hostPath: {path: /var}
