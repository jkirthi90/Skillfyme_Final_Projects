apiVersion: v1
kind: Pod
metadata:
  name: insecure-test
  namespace: default

spec:
  hostNetwork: true
  hostPID: true

  containers:
    - name: insecure-container
      image: nginx:latest

      securityContext:
        privileged: false # changed to false for the hardening test
        runAsUser: 0
        allowPrivilegeEscalation: false # changed to false for the hardening test

        capabilities:
          add:
            - NET_ADMIN
            - SYS_ADMIN

      volumeMounts:
        - name: host-root
          mountPath: /host

  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
