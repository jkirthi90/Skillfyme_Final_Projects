# The 8 backend microservices. Changes from the original k8s/base/microservices.yaml:
# - images from my GHCR (built by the repo's CI), 1 replica each, smaller memory requests
# - DATABASE_URL per service: Python needs postgresql+asyncpg://, Go needs ?sslmode=disable
# - readiness probes so traffic waits until each service is up
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-catalog
  template:
    metadata:
      labels:
        app: course-catalog
    spec:
      containers:
        - name: course-catalog
          image: ghcr.io/jkirthi90/course-catalog:latest
          ports:
            - containerPort: 9101
          envFrom:
            - configMapRef:
                name: skillfyme-config
          env:
            - name: PORT
              value: "9101"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: { name: skillfyme-secrets, key: MONGODB_URI }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 9101 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9101 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: course-catalog
spec:
  selector:
    app: course-catalog
  ports:
    - port: 9101
      targetPort: 9101
