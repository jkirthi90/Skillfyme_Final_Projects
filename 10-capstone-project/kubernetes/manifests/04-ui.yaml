# UI tier. ui-frontend (nginx) proxies /api to ui-backend.
# NodePorts replace the original Ingress (it used the skillfyme.com domain and TLS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-backend
  template:
    metadata:
      labels:
        app: ui-backend
    spec:
      containers:
        - name: ui-backend
          image: ghcr.io/jkirthi90/ui-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: skillfyme-config
          env:
            - name: PORT
              value: "4000"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: skillfyme-secrets, key: JWT_SECRET }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "300m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 4000 }
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ui-backend
spec:
  type: NodePort
  selector:
    app: ui-backend
  ports:
    - port: 4000
      targetPort: 4000
      nodePort: 30400
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui-frontend
  template:
    metadata:
      labels:
        app: ui-frontend
    spec:
      containers:
        - name: ui-frontend
          image: ghcr.io/jkirthi90/ui-frontend:latest
          ports:
            - containerPort: 3000
          resources:
            requests: { cpu: "50m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ui-frontend
spec:
  type: NodePort
  selector:
    app: ui-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30300
